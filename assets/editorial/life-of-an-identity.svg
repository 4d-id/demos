<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="life-of-an-identity-title life-of-an-identity-desc" style="max-width:100%;height:auto">
<title id="life-of-an-identity-title">An identity through time</title>
<desc id="life-of-an-identity-desc">A luminous ribbon crosses the dark field, branching into parallel histories before rejoining. Small spatial objects mark changes along the continuous teal, periwinkle and coral trajectory.</desc>
