<title id="from-gers-buildings-to-operational-spaces-title">From mapped building to operational spaces</title>
<desc id="from-gers-buildings-to-operational-spaces-desc">A central mapped building identity opens into a deeper hierarchy of rooms, fixtures, and operational assets while retaining one calm external rendezvous ring.</desc>
