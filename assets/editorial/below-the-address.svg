<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="below-the-address-title below-the-address-desc" style="max-width:100%;height:auto">
<title id="below-the-address-title">Below the address</title>
<desc id="below-the-address-desc">A single building address resolves downward into a branching hierarchy of individually named rooms, openings, fixtures, and operational assets.</desc>
<defs>
  <linearGradient id="background" x2="1" y2="1"><stop stop-color="#111820"/><stop offset=".65" stop-color="#0b0f14"/><stop offset="1" stop-color="#101720"/></linearGradient>
  <radialGradient id="ambient"><stop stop-color="#4dd0c4" stop-opacity=".13"/><stop offset="1" stop-color="#4dd0c4" stop-opacity="0"/></radialGradient>
  <radialGradient id="blueAmbient"><stop stop-color="#7c8cff" stop-opacity=".14"/><stop offset="1" stop-color="#7c8cff" stop-opacity="0"/></radialGradient>
  <radialGradient id="coralAmbient"><stop stop-color="#ff7a59" stop-opacity=".1"/><stop offset="1" stop-color="#ff7a59" stop-opacity="0"/></radialGradient>
  <linearGradient id="faceTop" x2=".9" y2="1"><stop stop-color="#345765"/><stop offset="1" stop-color="#16323a"/></linearGradient>
  <linearGradient id="faceLeft" x2="1" y2="1"><stop stop-color="#19313c"/><stop offset="1" stop-color="#0d1b22"/></linearGradient>
  <linearGradient id="faceRight" x2="0" y2="1"><stop stop-color="#25414d"/><stop offset="1" stop-color="#12222c"/></linearGradient>
  <linearGradient id="slab" x2="1" y2="1"><stop stop-color="#172631" stop-opacity=".95"/><stop offset="1" stop-color="#0e1b22" stop-opacity=".95"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c8cff"/><stop offset=".48" stop-color="#4dd0c4"/><stop offset=".8" stop-color="#4dd0c4"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
  <linearGradient id="scan" x2=".4" y2="1"><stop stop-color="#ff7a59" stop-opacity=".18"/><stop offset="1" stop-color="#ff7a59" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#71818d" opacity=".22"/></pattern>
  <pattern id="fineGrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#6c8790" stroke-width=".5" opacity=".13"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
